<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Nail Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #0f0c1b;
            --card-dark: #1c172d;
            --border-purple: #2e244d;
            --accent-purple: #8b5cf6;
            --accent-purple-hover: #7c3aed;
        }
        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-purple);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-purple);
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex justify-center p-3 sm:p-5 relative overflow-x-hidden">

<!-- Overlay da Aba Lateral -->
<div id="drawerOverlay" onclick="toggleDrawer()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden transition-opacity duration-300"></div>

<!-- Aba Lateral Oculta (Drawer - Cadastro de Serviços) -->
<aside id="drawerSidebar" class="fixed top-0 right-0 h-full w-80 max-w-[85vw] bg-[#1c172d] border-l border-[#2e244d] z-50 transform translate-x-full transition-transform duration-300 ease-in-out p-5 flex flex-col justify-between shadow-2xl">
    <div>
        <div class="flex items-center justify-between border-b border-[#2e244d] pb-3 mb-5">
            <h2 class="text-lg font-bold text-purple-400 flex items-center gap-2">
                ⚙️ Cadastrar Serviço
            </h2>
            <button onclick="toggleDrawer()" class="text-gray-400 hover:text-white text-xl font-bold p-1">✕</button>
        </div>

        <form id="formServicoSidebar" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Nome do Serviço</label>
                <input type="text" id="nomeServicoInput" placeholder="Ex: Banho de Gel" required class="w-full bg-[#0f0c1b] border border-[#2e244d] rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Duração (Minutos)</label>
                <input type="number" id="duracaoInput" placeholder="Ex: 90" min="5" required class="w-full bg-[#0f0c1b] border border-[#2e244d] rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Valor (R$)</label>
                <input type="number" id="valorInput" step="0.01" min="0" placeholder="Ex: 80.00" required class="w-full bg-[#0f0c1b] border border-[#2e244d] rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
            </div>

            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm shadow-md mt-2">
                + Salvar Novo Serviço
            </button>
        </form>

        <!-- Lista de Serviços Já Cadastrados -->
        <div class="mt-8">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Serviços Ativos</h3>
            <div id="listaServicosDrawer" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Itens via JS -->
            </div>
        </div>
    </div>

    <div class="pt-4 border-t border-[#2e244d]">
        <button onclick="toggleDrawer()" class="w-full bg-transparent border border-[#2e244d] hover:bg-white/5 text-gray-300 py-2 rounded-lg text-xs">
            Fechar Menu
        </button>
    </div>
</aside>

<!-- Conteúdo Principal -->
<div class="w-full max-w-md flex flex-col gap-4">
    <!-- Cabeçalho -->
    <header class="flex items-center justify-between py-2">
        <div>
            <h1 class="text-xl font-bold text-purple-400 flex items-center gap-2">
                💅 Nail Agenda
            </h1>
            <p class="text-xs text-gray-400">Gestão de horários e atendimento</p>
        </div>
        
        <!-- Botão para Abrir Gaveta de Serviços -->
        <button onclick="toggleDrawer()" class="bg-[#1c172d] border border-[#2e244d] hover:border-purple-500 text-purple-300 text-xs font-semibold px-3 py-2 rounded-xl flex items-center gap-1.5 transition-all shadow-sm">
            <span>⚙️ Serviços</span>
        </button>
    </header>

    <!-- Formulário de Agendamento -->
    <section class="card rounded-2xl p-4 shadow-lg">
        <h2 class="text-xs font-bold text-purple-300 uppercase tracking-wider mb-3">➕ Novo Agendamento</h2>
        
        <form id="formAgendamento" class="space-y-3">
            <div>
                <label for="nomeCliente" class="block text-xs font-semibold text-gray-400 mb-1">Nome da Cliente</label>
                <input type="text" id="nomeCliente" placeholder="Ex: Raissa" required class="w-full bg-[#0f0c1b] border border-[#2e244d] rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="dataAgenda" class="block text-xs font-semibold text-gray-400 mb-1">Data</label>
                    <input type="date" id="dataAgenda" required class="w-full bg-[#0f0c1b] border border-[#2e244d] rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label for="horaInicio" class="block text-xs font-semibold text-gray-400 mb-1">Início</label>
                    <input type="time" id="horaInicio" required class="w-full bg-[#0f0c1b] border border-[#2e244d] rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <div>
                <label for="servicoSelect" class="block text-xs font-semibold text-gray-400 mb-1">Serviço / Procedimento</label>
                <select id="servicoSelect" required class="w-full bg-[#0f0c1b] border border-[#2e244d] rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                    <!-- Opções dinâmicas -->
                </select>
            </div>

            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition-colors text-sm shadow-md mt-1">
                Gravar Agendamento
            </button>
        </form>
    </section>

    <!-- Resumo e Filtro de Navegação por Data -->
    <section class="card rounded-2xl p-4 shadow-lg">
        <div class="flex items-center justify-between mb-3 border-b border-[#2e244d] pb-2">
            <h2 class="text-xs font-bold text-purple-300 uppercase tracking-wider">📅 Agenda & Resumo</h2>
            <input type="date" id="filtroData" onchange="renderizar()" class="bg-[#0f0c1b] border border-[#2e244d] text-xs text-purple-300 px-2 py-1 rounded-lg focus:outline-none focus:border-purple-500">
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-[#0f0c1b] border border-[#2e244d] p-3 rounded-xl text-center">
                <span class="text-[10px] text-gray-400 uppercase block font-medium">Atendimentos</span>
                <span class="text-lg font-bold text-white" id="totalQtd">0</span>
            </div>
            <div class="bg-[#0f0c1b] border border-[#2e244d] p-3 rounded-xl text-center">
                <span class="text-[10px] text-gray-400 uppercase block font-medium">Previsto no Dia</span>
                <span class="text-lg font-bold text-emerald-400" id="totalFaturamento">R$ 0,00</span>
            </div>
        </div>

        <!-- Lista de Agendamentos do Dia -->
        <div id="listaAgenda" class="space-y-2.5 max-h-[340px] overflow-y-auto pr-1">
            <!-- Itens inseridos via JS -->
        </div>
    </section>

    <!-- Backup de Dados -->
    <section class="card rounded-2xl p-4 shadow-lg mb-4">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">💾 Backup de Segurança</h2>
        <div class="grid grid-cols-2 gap-3">
            <button type="button" onclick="exportarBackup()" class="bg-transparent border border-[#2e244d] hover:bg-white/5 text-gray-300 font-semibold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5">
                📥 Exportar
            </button>
            <button type="button" onclick="document.getElementById('fileInput').click()" class="bg-transparent border border-[#2e244d] hover:bg-white/5 text-gray-300 font-semibold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5">
                📤 Importar
            </button>
            <input type="file" id="fileInput" accept=".json" class="hidden" onchange="importarBackup(event)">
        </div>
    </section>
</div>

<script>
    // Configurações e datas iniciais
    const hojeStr = new Date().toISOString().split('T')[0];
    document.getElementById('dataAgenda').value = hojeStr;
    document.getElementById('filtroData').value = hojeStr;

    // Estado dos Serviços (Salvo no LocalStorage)
    let servicos = JSON.parse(localStorage.getItem('nail_servicos')) || [
        { id: 1, nome: "Aplicação Molde F1", duracao: 180, valor: 120.00 },
        { id: 2, nome: "Banho de gel", duracao: 90, valor: 80.00 },
        { id: 3, nome: "Blindagem", duracao: 45, valor: 70.00 },
        { id: 4, nome: "Manutenção", duracao: 150, valor: 95.00 },
        { id: 5, nome: "Pedicure completa", duracao: 60, valor: 50.00 }
    ];

    // Estado dos Agendamentos
    let agendamentos = JSON.parse(localStorage.getItem('nail_agendamentos')) || [];

    // Alternar visibilidade da Aba Lateral (Drawer)
    function toggleDrawer() {
        const drawer = document.getElementById('drawerSidebar');
        const overlay = document.getElementById('drawerOverlay');
        const isOpen = !drawer.classList.contains('translate-x-full');

        if (isOpen) {
            drawer.classList.add('translate-x-full');
            overlay.classList.add('hidden');
        } else {
            drawer.classList.remove('translate-x-full');
            overlay.classList.remove('hidden');
        }
    }

    // Formulário de Cadastro de Serviço na Sidebar
    document.getElementById('formServicoSidebar').addEventListener('submit', function(e) {
        e.preventDefault();
        const nome = document.getElementById('nomeServicoInput').value.trim();
        const duracao = parseInt(document.getElementById('duracaoInput').value);
        const valor = parseFloat(document.getElementById('valorInput').value);

        if (!nome || !duracao || isNaN(valor)) return;

        servicos.push({ id: Date.now(), nome, duracao, valor });
        localStorage.setItem('nail_servicos', JSON.stringify(servicos));

        this.reset();
        atualizarInterfaceServicos();
    });

    function deletarServico(id) {
        if (confirm("Deseja apagar este serviço?")) {
            servicos = servicos.filter(s => s.id !== id);
            localStorage.setItem('nail_servicos', JSON.stringify(servicos));
            atualizarInterfaceServicos();
        }
    }

    // Atualiza Select do formulário e lista na aba lateral
    function atualizarInterfaceServicos() {
        const select = document.getElementById('servicoSelect');
        const listaDrawer = document.getElementById('listaServicosDrawer');

        select.innerHTML = '<option value="" disabled selected>Escolha o serviço...</option>';
        listaDrawer.innerHTML = '';

        servicos.forEach(s => {
            // Preenche o Select
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = `${s.nome} (${s.duracao}m) - R$ ${s.valor.toFixed(2)}`;
            select.appendChild(opt);

            // Preenche Lista do Drawer
            const div = document.createElement('div');
            div.className = 'bg-[#0f0c1b] border border-[#2e244d] p-2 rounded-lg flex items-center justify-between text-xs';
            div.innerHTML = `
                <div>
                    <span class="font-semibold text-white block">${s.nome}</span>
                    <span class="text-gray-400 text-[10px]">${s.duracao} min | R$ ${s.valor.toFixed(2)}</span>
                </div>
                <button onclick="deletarServico(${s.id})" class="text-red-400 hover:text-red-300 p-1">🗑️</button>
            `;
            listaDrawer.appendChild(div);
        });
    }

    // Gravar Agendamento
    document.getElementById('formAgendamento').addEventListener('submit', function(e) {
        e.preventDefault();

        const cliente = document.getElementById('nomeCliente').value.trim();
        const data = document.getElementById('dataAgenda').value;
        const horaInicio = document.getElementById('horaInicio').value;
        const servicoId = parseInt(document.getElementById('servicoSelect').value);

        const servico = servicos.find(s => s.id === servicoId);
        if (!servico) return;

        // Cálculo do término com base na duração do serviço
        const [h, m] = horaInicio.split(':').map(Number);
        const minInicio = h * 60 + m;
        const minFim = minInicio + servico.duracao;

        const horaFimCalculada = `${String(Math.floor(minFim / 60) % 24).padStart(2, '0')}:${String(minFim % 60).padStart(2, '0')}`;

        const novoAgendamento = {
            id: Date.now(),
            cliente,
            data,
            horaInicio,
            horaFim: horaFimCalculada,
            nomeServico: servico.nome,
            valor: servico.valor
        };

        agendamentos.push(novoAgendamento);
        salvarEAtualizar();

        // Limpa campos mantendo a data selecionada
        document.getElementById('nomeCliente').value = '';
        document.getElementById('horaInicio').value = '';
        document.getElementById('servicoSelect').selectedIndex = 0;
    });

    function salvarEAtualizar() {
        localStorage.setItem('nail_agendamentos', JSON.stringify(agendamentos));
        renderizar();
    }

    function deletarAgendamento(id) {
        if (confirm("Deseja cancelar este agendamento?")) {
            agendamentos = agendamentos.filter(a => a.id !== id);
            salvarEAtualizar();
        }
    }

    // Converte YYYY-MM-DD para Formato Legível com Dia da Semana
    function formatarDataExtenso(dataISO) {
        const [ano, mes, dia] = dataISO.split('-').map(Number);
        const dateObj = new Date(ano, mes - 1, dia);

        const diasSemana = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
        const diaSemanaStr = diasSemana[dateObj.getDay()];
        const dataFormatada = `${String(dia).padStart(2, '0')}/${String(mes).padStart(2, '0')}/${ano}`;

        return { diaSemanaStr, dataFormatada };
    }

    // Renderiza Agendamentos do Dia Selecionado
    function renderizar() {
        const dataFiltro = document.getElementById('filtroData').value;
        const lista = document.getElementById('listaAgenda');
        lista.innerHTML = '';

        const filtrados = agendamentos.filter(a => a.data === dataFiltro);
        filtrados.sort((a, b) => a.horaInicio.localeCompare(b.horaInicio));

        let totalFaturamento = 0;

        filtrados.forEach(item => {
            totalFaturamento += item.valor;
            const { diaSemanaStr, dataFormatada } = formatarDataExtenso(item.data);

            const div = document.createElement('div');
            div.className = 'bg-[#0f0c1b] border border-[#2e244d] p-3 rounded-xl flex items-center justify-between';
            div.innerHTML = `
                <div class="space-y-0.5">
                    <div class="flex items-center gap-2">
                        <strong class="text-sm text-white">${item.cliente}</strong>
                        <span class="text-[10px] bg-purple-900/50 border border-purple-700/50 text-purple-300 px-1.5 py-0.5 rounded-md font-medium">
                            ${item.horaInicio} → ${item.horaFim}
                        </span>
                    </div>
                    <div class="text-xs font-medium text-purple-400">
                        💅 ${item.nomeServico}
                    </div>
                    <div class="text-[10px] text-gray-400">
                        📅 ${diaSemanaStr}, ${dataFormatada}
                    </div>
                </div>
                <div class="text-right flex flex-col items-end">
                    <span class="text-sm font-bold text-emerald-400">R$ ${item.valor.toFixed(2)}</span>
                    <button onclick="deletarAgendamento(${item.id})" class="text-[10px] text-red-400 hover:text-red-300 mt-1 transition-colors">
                        Cancelar
                    </button>
                </div>
            `;
            lista.appendChild(div);
        });

        if (filtrados.length === 0) {
            lista.innerHTML = `<p class="text-center text-xs text-gray-500 py-6">Nenhum agendamento para este dia.</p>`;
        }

        document.getElementById('totalQtd').innerText = filtrados.length;
        document.getElementById('totalFaturamento').innerText = `R$ ${totalFaturamento.toFixed(2)}`;
    }

    // Exportar e Importar Backup
    function exportarBackup() {
        if (agendamentos.length === 0 && servicos.length === 0) {
            alert("Não há dados salvos para exportar.");
            return;
        }
        const payload = { servicos, agendamentos };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_agenda_nail_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
    }

    function importarBackup(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const dados = JSON.parse(e.target.result);
                if (dados.servicos && dados.agendamentos) {
                    if (confirm("Isso irá substituir todos os dados atuais. Deseja continuar?")) {
                        servicos = dados.servicos;
                        agendamentos = dados.agendamentos;
                        localStorage.setItem('nail_servicos', JSON.stringify(servicos));
                        salvarEAtualizar();
                        atualizarInterfaceServicos();
                        alert("Backup restaurado com sucesso!");
                    }
                } else {
                    alert("Estrutura do arquivo de backup inválida.");
                }
            } catch (err) {
                alert("Erro ao ler o arquivo JSON.");
            }
        };
        reader.readAsText(file);
    }

    // Inicialização
    atualizarInterfaceServicos();
    renderizar();
</script>
</body>
</html>
