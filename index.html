<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Nail Designer</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1c172d;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2e244d;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--accent);
        }

        .btn-menu {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Menu Lateral (Drawer) */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            display: none;
            justify-content: flex-end;
            z-index: 1000;
        }

        .drawer-overlay.open {
            display: flex;
        }

        .drawer {
            width: 85%;
            max-width: 380px;
            height: 100%;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            overflow-y: auto;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .drawer-header h2 {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .summary-box {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 10px;
            text-align: center;
        }

        .summary-box .lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .summary-box .val {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 0.2rem;
            color: var(--text-main);
        }

        .summary-box.highlight .val {
            color: var(--success);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin-bottom: 0.85rem;
        }

        .form-row {
            display: flex;
            gap: 0.75rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        input, select, button {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .agenda-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 320px;
            overflow-y: auto;
        }

        .agenda-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            padding: 0.85rem;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .agenda-info strong {
            display: block;
            font-size: 0.95rem;
        }

        .agenda-info span {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
        }

        .agenda-price {
            text-align: right;
            font-weight: bold;
            color: var(--success);
            font-size: 1rem;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.2rem;
            margin-top: 0.2rem;
        }

        .backup-actions {
            display: flex;
            gap: 0.75rem;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✨ Agenda Nail Designer</h1>
        <button type="button" class="btn-menu" onclick="toggleDrawer(true)">⚙️ Serviços</button>
    </header>

    <!-- Menu Lateral (Drawer) -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="fecharFora(event)">
        <div class="drawer">
            <div class="drawer-header">
                <h2>Gerenciar Serviços</h2>
                <button type="button" class="btn-close" onclick="toggleDrawer(false)">✕</button>
            </div>
            
            <form id="formServico">
                <div class="form-group">
                    <label for="nomeServicoInput">Nome do Serviço</label>
                    <input type="text" id="nomeServicoInput" placeholder="Ex: Banho de Gel" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="duracaoInput">Duração (Min)</label>
                        <input type="number" id="duracaoInput" placeholder="Ex: 90" required>
                    </div>
                    <div class="form-group">
                        <label for="valorInput">Valor (R$)</label>
                        <input type="number" id="valorInput" step="0.01" placeholder="Ex: 80.00" required>
                    </div>
                </div>
                <button type="submit">Cadastrar Serviço</button>
            </form>

            <div style="margin-top: 1rem;">
                <h3 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;">Serviços Cadastrados:</h3>
                <div id="listaServicosDrawer" style="display: flex; flex-direction: column; gap: 0.5rem; max-height: 250px; overflow-y: auto;">
                </div>
            </div>
        </div>
    </div>

    <!-- Novo Agendamento -->
    <section class="card">
        <h2>Novo Agendamento</h2>
        <form id="formAgendamento">
            <div class="form-group">
                <label for="nomeCliente">Nome da Cliente</label>
                <input type="text" id="nomeCliente" placeholder="Ex: Raissa" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dataAgenda">Data</label>
                    <input type="date" id="dataAgenda" required>
                </div>
                <div class="form-group">
                    <label for="horaInicio">Horário Início</label>
                    <input type="time" id="horaInicio" required>
                </div>
            </div>

            <div class="form-group">
                <label for="servicoSelect">Serviço / Procedimento</label>
                <select id="servicoSelect" required>
                    <option value="" disabled selected>Selecione um serviço...</option>
                </select>
            </div>

            <button type="submit">Gravar Agendamento</button>
        </form>
    </section>

    <!-- Resumo do Dia e Navegação -->
    <section class="card">
        <h2>Resumo Diário e Navegação</h2>
        <div class="form-group" style="margin-bottom: 1rem;">
            <label for="filtroData">Visualizar Data</label>
            <input type="date" id="filtroData" onchange="renderizar()">
        </div>

        <div class="summary-row">
            <div class="summary-box">
                <div class="lbl">Agendamentos</div>
                <div class="val" id="totalQtd">0</div>
            </div>
            <div class="summary-box highlight">
                <div class="lbl">Faturamento Previsto</div>
                <div class="val" id="totalFaturamento">R$ 0,00</div>
            </div>
        </div>

        <div class="agenda-list" id="listaAgenda">
        </div>
    </section>

    <!-- Backup de Dados -->
    <section class="card">
        <h2>Backup de Dados</h2>
        <div class="backup-actions">
            <button type="button" class="btn-secondary" onclick="exportarBackup()">📥 Exportar</button>
            <button type="button" class="btn-secondary" onclick="document.getElementById('fileInput').click()">📤 Importar</button>
            <input type="file" id="fileInput" accept=".json" onchange="importarBackup(event)">
        </div>
    </section>
</div>

<script>
    function getTodayString() {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    const hojeStr = getTodayString();
    document.getElementById('dataAgenda').value = hojeStr;
    document.getElementById('filtroData').value = hojeStr;

    let servicos = JSON.parse(localStorage.getItem('nail_servicos')) || [
        { id: 1, nome: "Aplicação Molde F1", duracao: 180, valor: 120.00 },
        { id: 2, nome: "Banho de gel", duracao: 90, valor: 80.00 },
        { id: 3, nome: "Blindagem", duracao: 45, valor: 70.00 },
        { id: 4, nome: "Manutenção", duracao: 150, valor: 95.00 },
        { id: 5, nome: "Pedicure completa", duracao: 60, valor: 50.00 }
    ];

    let agendamentos = JSON.parse(localStorage.getItem('nail_agendamentos')) || [];

    function toggleDrawer(abrir) {
        const overlay = document.getElementById('drawerOverlay');
        if (abrir) {
            overlay.classList.add('open');
            renderizarServicosDrawer();
        } else {
            overlay.classList.remove('open');
        }
    }

    function fecharFora(event) {
        if (event.target === document.getElementById('drawerOverlay')) {
            toggleDrawer(false);
        }
    }

    // Cadastrar serviço
    const formServico = document.getElementById('formServico');
    formServico.addEventListener('submit', function(e) {
        e.preventDefault();
        const nome = document.getElementById('nomeServicoInput').value.trim();
        const duracao = parseInt(document.getElementById('duracaoInput').value);
        const valor = parseFloat(document.getElementById('valorInput').value);

        if(!nome || isNaN(duracao) || isNaN(valor)) return;

        servicos.push({ id: Date.now(), nome, duracao, valor });
        localStorage.setItem('nail_servicos', JSON.stringify(servicos));
        
        formServico.reset();
        atualizarSelectServicos();
        renderizarServicosDrawer();
    });

    function deletarServico(id) {
        if (confirm("Deseja apagar este serviço?")) {
            servicos = servicos.filter(s => s.id !== id);
            localStorage.setItem('nail_servicos', JSON.stringify(servicos));
            atualizarSelectServicos();
            renderizarServicosDrawer();
        }
    }

    function renderizarServicosDrawer() {
        const container = document.getElementById('listaServicosDrawer');
        container.innerHTML = '';

        if(servicos.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted); font-size:0.8rem;">Nenhum serviço cadastrado.</p>';
            return;
        }

        servicos.forEach(s => {
            const div = document.createElement('div');
            div.style.cssText = "background: var(--bg-color); padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;";
            div.innerHTML = `
                <div>
                    <strong>${s.nome}</strong><br>
                    <span style="color:var(--text-muted);">${s.duracao} min - R$ ${s.valor.toFixed(2)}</span>
                </div>
                <button type="button" onclick="deletarServico(${s.id})" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:1rem; width:auto; padding:0;">🗑️</button>
            `;
            container.appendChild(div);
        });
    }

    function atualizarSelectServicos() {
        const select = document.getElementById('servicoSelect');
        select.innerHTML = '<option value="" disabled selected>Selecione um serviço...</option>';
        servicos.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = `${s.nome} (${s.duracao} min) - R$ ${s.valor.toFixed(2)}`;
            select.appendChild(opt);
        });
    }

    // Gravar Agendamento
    const formAgendamento = document.getElementById('formAgendamento');
    formAgendamento.addEventListener('submit', function(e) {
        e.preventDefault();

        const cliente = document.getElementById('nomeCliente').value.trim();
        const data = document.getElementById('dataAgenda').value;
        const horaInicio = document.getElementById('horaInicio').value;
        const servicoId = parseInt(document.getElementById('servicoSelect').value);

        const servicoEscolhido = servicos.find(s => s.id === servicoId);
        if (!servicoEscolhido) {
            alert("Selecione um serviço válido.");
            return;
        }

        const [hIni, mIni] = horaInicio.split(':').map(Number);
        const totalMinutosInicio = hIni * 60 + mIni;
        const totalMinutosFim = totalMinutosInicio + servicoEscolhido.duracao;
        
        const hFim = Math.floor(totalMinutosFim / 60) % 24;
        const mFim = totalMinutosFim % 60;
        const horaFim = `${String(hFim).padStart(2, '0')}:${String(mFim).padStart(2, '0')}`;

        // Checagem de Conflito de Horário
        const conflito = agendamentos.find(item => {
            if (item.data !== data) return false;
            
            const [hItemIni, mItemIni] = item.horaInicio.split(':').map(Number);
            const [hItemFim, mItemFim] = item.horaFim.split(':').map(Number);
            const itemMinInicio = hItemIni * 60 + mItemIni;
            const itemMinFim = hItemFim * 60 + mItemFim;

            // Verifica se há qualquer sobreposição entre os intervalos [totalMinutosInicio, totalMinutosFim] e [itemMinInicio, itemMinFim]
            return (totalMinutosInicio < itemMinFim && totalMinutosFim > itemMinInicio);
        });

        if (conflito) {
            alert(`⚠️ Horário Indisponível!\n\nJá existe um agendamento para "${conflito.cliente}" (${conflito.nomeServico}) das ${conflito.horaInicio} às ${conflito.horaFim}.`);
            return;
        }

        const novoAgendamento = {
            id: Date.now(),
            cliente,
            data,
            horaInicio,
            horaFim,
            nomeServico: servicoEscolhido.nome,
            valor: servicoEscolhido.valor
        };

        agendamentos.push(novoAgendamento);
        salvarEAtualizar();
        
        document.getElementById('filtroData').value = data;
        renderizar();

        document.getElementById('nomeCliente').value = '';
        document.getElementById('horaInicio').value = '';
        document.getElementById('servicoSelect').selectedIndex = 0;
    });

    function salvarEAtualizar() {
        localStorage.setItem('nail_agendamentos', JSON.stringify(agendamentos));
        renderizar();
    }

    function deletarAgendamento(id) {
        if(confirm("Deseja cancelar/excluir este agendamento?")) {
            agendamentos = agendamentos.filter(a => a.id !== id);
            salvarEAtualizar();
        }
    }

    function formatarDataExtenso(dataIso) {
        const [ano, mes, dia] = dataIso.split('-').map(Number);
        const dataObj = new Date(ano, mes - 1, dia);
        const diasSemana = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
        const diaSemanaStr = diasSemana[dataObj.getDay()];
        return `${diaSemanaStr}, ${String(dia).padStart(2, '0')}/${String(mes).padStart(2, '0')}/${ano}`;
    }

    function renderizar() {
        const dataFiltro = document.getElementById('filtroData').value;
        const lista = document.getElementById('listaAgenda');
        lista.innerHTML = '';

        const filtrados = agendamentos.filter(a => a.data === dataFiltro);
        filtrados.sort((a, b) => a.horaInicio.localeCompare(b.horaInicio));

        let faturamentoDia = 0;

        filtrados.forEach(item => {
            faturamentoDia += item.valor;
            const dataFormatada = formatarDataExtenso(item.data);

            const div = document.createElement('div');
            div.className = 'agenda-item';
            div.innerHTML = `
                <div class="agenda-info">
                    <strong>${item.cliente}</strong>
                    <span>${item.nomeServico}</span>
                    <span style="color: var(--accent); margin-top:0.2rem;">${dataFormatada} (${item.horaInicio} → ${item.horaFim})</span>
                </div>
                <div style="text-align: right;">
                    <div class="agenda-price">R$ ${item.valor.toFixed(2)}</div>
                    <button type="button" class="btn-delete" onclick="deletarAgendamento(${item.id})">❌ Cancelar</button>
                </div>
            `;
            lista.appendChild(div);
        });

        if (filtrados.length === 0) {
            lista.innerHTML = `<p style="text-align:center; color: var(--text-muted); font-size: 0.85rem; padding: 1rem 0;">Nenhum agendamento para este dia.</p>`;
        }

        document.getElementById('totalQtd').innerText = filtrados.length;
        document.getElementById('totalFaturamento').innerText = `R$ ${faturamentoDia.toFixed(2)}`;
    }

    function exportarBackup() {
        if (agendamentos.length === 0 && servicos.length === 0) {
            alert("Não há dados para exportar.");
            return;
        }
        const dadosExportar = { servicos, agendamentos };
        const jsonStr = JSON.stringify(dadosExportar, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_agenda_nail_${getTodayString()}.json`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
    }

    function importarBackup(event) {
        const fileReader = new FileReader();
        fileReader.onload = function(e) {
            try {
                const dadosImportados = JSON.parse(e.target.result);
                if (dadosImportados.agendamentos && dadosImportados.servicos) {
                    if (confirm("Isso vai substituir os dados atuais. Deseja continuar?")) {
                        agendamentos = dadosImportados.agendamentos;
                        servicos = dadosImportados.servicos;
                        localStorage.setItem('nail_servicos', JSON.stringify(servicos));
                        salvarEAtualizar();
                        atualizarSelectServicos();
                        renderizarServicosDrawer();
                        alert("Backup importado com sucesso!");
                    }
                } else {
                    alert("Arquivo de backup inválido.");
                }
            } catch (err) {
                alert("Erro ao ler o arquivo JSON.");
            }
        };
        if(event.target.files[0]) {
            fileReader.readAsText(event.target.files[0]);
        }
    }

    atualizarSelectServicos();
    renderizar();
</script>
</body>
</html>
